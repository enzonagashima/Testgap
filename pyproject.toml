[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testgap"
version = "0.1.0"
description = "Plataforma local para criação, curadoria e exportação de datasets de treinamento de IA sobre lacunas de testes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TestGap Team"}
]
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "jsonschema>=4.20.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "altair>=5.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v"
